name: Create Jira Issue
description: Creates a Jira issue. The step succeeds if the issue was created and fails otherwise.

on:
  # Triggered by release splitting event coming from techsee-api
  repository_dispatch:
    types: [create-jira-issue]

  workflow_dispatch:
   inputs:
    project-key:
     description: Jira project key (e.g. HY)
     required: true
    issue-type:
     description: Jira issue type name
     required: false
     default: Task
    summary:
     description: Issue summary
     required: true
    jira-token:
     description: Jira API token (pass from secrets)
     required: true

jobs:
  create-issue:
   runs-on: ubuntu-latest
   steps:
    - name: Create Jira issue
      shell: bash
      env:
        JIRA_BASE_URL: https://techsee.atlassian.net
        JIRA_USER_EMAIL: ${{ inputs.jira-user-email }}
        JIRA_API_TOKEN: ${{ inputs.jira-token }}
        PROJECT_KEY: ${{ inputs.project-key }}
        ISSUE_TYPE: ${{ inputs.issue-type }}
        SUMMARY: ${{ inputs.summary }}
      run: |
        PAYLOAD=$(jq -n \
          --arg project "$PROJECT_KEY" \
          --arg issuetype "$ISSUE_TYPE" \
          --arg summary "$SUMMARY" \
          '{ fields: { project: { key: $project }, issuetype: { name: $issuetype }, summary: $summary } }')

        RESPONSE_FILE=$(mktemp)
        HTTP_STATUS=$(curl --silent --show-error \
          --request POST \
          --url "${JIRA_BASE_URL}/rest/api/3/issue" \
          --user "${JIRA_USER_EMAIL}:${JIRA_API_TOKEN}" \
          --header "Accept: application/json" \
          --header "Content-Type: application/json" \
          --data "$PAYLOAD" \
          --output "$RESPONSE_FILE" \
          --write-out "%{http_code}") || { echo "::error::Request to Jira failed"; exit 1; }

        # Jira returns 201 Created on success
        if [ "$HTTP_STATUS" -ne 201 ]; then
          echo "::error::Jira issue creation failed with HTTP status $HTTP_STATUS"
          cat "$RESPONSE_FILE"
          exit 1
        fi

        ISSUE_KEY=$(jq -r '.key // empty' "$RESPONSE_FILE")
        if [ -z "$ISSUE_KEY" ]; then
          echo "::error::Could not extract issue key from Jira response"
          cat "$RESPONSE_FILE"
          exit 1
        fi

        echo "Created Jira issue $ISSUE_KEY"
        echo "issue-key=$ISSUE_KEY" >> "$GITHUB_OUTPUT"
